name: Deploy

# Lädt die Seite per FTPS auf den Netcup-Webspace: automatisch bei jedem Push
# auf main, zusätzlich auf Knopfdruck (Actions › Deploy › Run workflow).
# Benötigte Secrets (GitHub: Settings › Secrets and variables › Actions):
#   FTP_SERVER    z. B. hostingXXXXXX.netcup.net
#   FTP_USERNAME  eigener FTP-Benutzer, dessen Startverzeichnis das Webverzeichnis der Subdomain ist
#   FTP_PASSWORD  dessen Passwort

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # Startverzeichnis des FTP-Benutzers = Webverzeichnis der Subdomain
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.idea/**
